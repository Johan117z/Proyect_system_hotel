spring.application.name=sistemahotel

# Conexión a MySQL. La BD se crea con Fase4_Base_Datos/script_hotel_db.sql (tablas, CHECK, triggers y datos de prueba).
# Cada valor se puede sobrescribir con variables de entorno (.env / Docker): DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/system_hotel_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# none: el esquema lo define el script SQL (CHECK, ENUM y triggers que Hibernate no genera).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# JSON: fechas en ISO 8601 (2026-12-01) y zona horaria de Colombia
spring.jackson.time-zone=America/Bogota

# CORS: orígenes que pueden consumir la API desde otro dominio o puerto (separados por coma).
# "*" sirve en desarrollo; en producción se ponen los dominios reales del frontend web y móvil.
app.cors.allowed-origins=${CORS_ORIGINS:*}
