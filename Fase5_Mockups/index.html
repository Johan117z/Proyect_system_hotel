<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gran Continental · Gestión hotelera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9; --card:#ffffff; --ink:#111827; --ink-2:#374151; --muted:#6b7280; --line:#e8eaf0; --line-2:#d5d9e2; --hover:#f3f4f8;
  --primary:#1b2a4e; --primary-2:#26396b; --accent:#c9a45c;
  --ok:#12805c; --ok-bg:#e3f6ee; --ok-line:#c3ead9; --ok-dot:#22b07d;
  --bad:#c0352b; --bad-bg:#fdecea; --bad-line:#f6cbc6; --bad-dot:#e5484d;
  --warn:#a85d00; --warn-bg:#fff3dc; --warn-line:#f6dba8; --warn-dot:#f5a524;
  --info:#2f55d4; --info-bg:#e9eefd; --muted-bg:#eef0f5;
  --r-sm:8px; --r-md:10px; --r-lg:16px; --r-xl:20px;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 4px 14px rgba(17,24,39,.05);
  --shadow-lg:0 20px 50px rgba(17,24,39,.22);
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.muted{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:-3px}

/* ---------- Marca ---------- */
.mono{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.04em;flex:none}
.mono.sm{width:34px;height:34px}
.mono.light{background:rgba(255,255,255,.14);color:#fff}

/* ---------- Login ---------- */
.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:#eceef5}
.login-shell{width:100%;max-width:960px;display:grid;grid-template-columns:1.05fr 1fr;background:var(--card);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg)}
.login-art{position:relative;overflow:hidden;background:linear-gradient(155deg,#1b2a4e 0%,#27408a 100%);color:#fff;padding:36px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-height:560px}
.login-art::before,.login-art::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.06)}
.login-art::before{width:360px;height:360px;right:-120px;bottom:-110px}
.login-art::after{width:220px;height:220px;right:90px;bottom:-60px;background:rgba(201,164,92,.18)}
.art-brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;position:relative;z-index:1}
.art-copy{position:relative;z-index:1}
.art-copy h1{font-size:34px;line-height:1.15;font-weight:600}
.art-copy p{margin-top:12px;color:#c8d1ea;max-width:320px;font-size:15px}
.art-chips{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.art-chips span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:500}
.login-panel{display:grid;place-items:center;padding:36px}
.login-card{width:100%;max-width:340px}
.login-card h2{font-size:24px}
.login-card .lead{color:var(--muted);margin:6px 0 24px}
.login-card label{display:block;font-weight:500;font-size:13px;color:var(--ink-2);margin-bottom:16px}
.login-card label input{margin-top:6px}
.demo-box{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.demo-box>p{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:10px}
.demo-grid{display:grid;gap:8px}
.demo-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);padding:10px 12px;cursor:pointer;border-radius:12px;transition:background .15s,border-color .15s}
.demo-btn:hover{background:var(--hover);border-color:var(--line-2)}
.demo-btn .dav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.demo-btn .dav.a{background:#efe7fb;color:#6a3fc2}
.demo-btn .dav.r{background:var(--info-bg);color:var(--info)}
.demo-btn b{display:block;font-weight:600;font-size:13.5px}
.demo-btn small{color:var(--muted);font-size:12px}

/* ---------- Controles ---------- */
input,select{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-md);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:#b9bfcc}
input:focus,select:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(38,57,107,.15)}
input[readonly],select:disabled{background:#f4f5f8;color:#8b92a3;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-md);height:40px;padding:0 16px;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{background:var(--hover)}
.btn-success{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.btn-success:hover{background:#d2f0e3}
.btn-danger{background:var(--bad-dot);color:#fff}
.btn-danger:hover{background:#cf3a3f}
.btn-danger-ghost{background:#fff;color:var(--bad);border-color:var(--bad-line)}
.btn-danger-ghost:hover{background:var(--bad-bg)}
.btn.is-locked{opacity:.62;cursor:not-allowed;background:repeating-linear-gradient(135deg,#f4f5f8,#f4f5f8 6px,#eceef3 6px,#eceef3 12px);color:#7b8294;border-color:var(--line)}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:8px;border-radius:var(--r-md);color:inherit;display:inline-flex}
.icon-btn:hover{background:var(--hover)}
.form-error{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line);border-radius:var(--r-md);padding:10px 12px;font-size:13px;margin-bottom:12px}
.hint{display:block;color:var(--muted);font-weight:400;margin-top:6px;font-size:12px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:auto 1fr;min-height:100vh}
.sidebar{width:252px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .2s;z-index:40}
.app.collapsed .sidebar{width:80px}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 16px;white-space:nowrap}
.brand-text{font-weight:600;font-size:15px;line-height:1.2}
.brand-text small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
#nav{flex:1;padding:8px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav-item{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;text-align:left;white-space:nowrap;width:100%;font-size:14px;font-weight:500;transition:background .15s}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-ico{width:22px;display:inline-flex;justify-content:center;color:#7a8194}
.nav-item.active .nav-ico{color:var(--accent)}
.sidebar-foot{padding:14px;border-top:1px solid var(--line)}
.sidebar-foot .btn{width:100%;justify-content:flex-start}
.app.collapsed .nav-label,.app.collapsed .brand-text,.app.collapsed .foot-label{display:none}
.app.collapsed .brand{justify-content:center;padding:20px 0 16px}
.app.collapsed .nav-item{justify-content:center;padding:0}
.app.collapsed .sidebar-foot .btn{justify-content:center}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.topbar .ttl{flex:1;min-width:0}
.topbar h2{font-size:20px}
.crumb{font-size:12.5px;color:var(--muted)}
.clock{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;padding:6px 12px;background:var(--bg);border-radius:999px}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border:1px solid var(--line);border-radius:999px;background:#fff}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.who{display:flex;flex-direction:column;gap:3px}
.who b{font-size:13px;line-height:1;font-weight:600}
.role-badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;align-self:flex-start}
.role-admin{background:#efe7fb;color:#6a3fc2}
.role-recepcion{background:var(--info-bg);color:var(--info)}
.view{padding:28px;max-width:1400px;width:100%;outline:none}
.view-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
.view-head h3{font-size:22px;flex:1;min-width:180px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:250px}
.hello{margin-bottom:22px}
.hello h3{font-size:24px}
.hello p{color:var(--muted);margin-top:2px}

/* ---------- Tarjetas, tablas ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;display:flex;gap:14px;align-items:flex-start}
.stat-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--muted-bg);color:var(--ink-2)}
.stat-ic.ok{background:var(--ok-bg);color:var(--ok)}
.stat-ic.bad{background:var(--bad-bg);color:var(--bad)}
.stat-ic.warn{background:var(--warn-bg);color:var(--warn)}
.stat-ic.info{background:var(--info-bg);color:var(--info)}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.val{font-size:28px;font-weight:600;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.val.money{font-size:20px;padding-top:5px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c3c8d4}
.dot.ok{background:var(--ok-dot)}.dot.bad{background:var(--bad-dot)}.dot.warn{background:var(--warn-dot)}.dot.info{background:var(--info)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 22px}
.section-title{font-size:16px;font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:400;margin-left:auto}
.legend .dot{margin-right:6px}
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:32px}
.tile{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:178px}
.tile.ok{background:linear-gradient(180deg,#eefaf4,#fff 70%);border-color:var(--ok-line)}
.tile.bad{background:linear-gradient(180deg,#fff0ee,#fff 70%);border-color:var(--bad-line)}
.tile.warn{background:linear-gradient(180deg,#fff6e3,#fff 70%);border-color:var(--warn-line)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile h4{font-size:30px;line-height:1.05;letter-spacing:-.03em}
.tile p{font-size:13px}
.tile .btn{margin-top:auto;align-self:flex-start}
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:auto;margin-bottom:28px}
table.table{width:100%;border-collapse:collapse;min-width:640px}
.table th{background:#fafbfd;text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:#fafbfd}
.table th.num{text-align:right}
.empty{text-align:center;color:var(--muted);padding:34px!important}
.row-actions{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg);color:var(--info)}
.badge.muted{background:var(--muted-bg);color:#555d6e}
.small{font-size:12.5px;color:var(--muted)}
.perm-list{display:flex;flex-wrap:wrap;gap:8px}
.perm{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid transparent;font-weight:500}
.perm.yes{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.perm.no{background:#f4f5f8;color:#8b92a3;border-color:var(--line)}
.perm.no span{text-decoration:line-through}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;z-index:100;animation:fade .15s}
.modal{background:var(--card);border-radius:var(--r-xl);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:720px}
.modal form{display:flex;flex-direction:column;min-height:0}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px}
.modal header h3{font-size:19px}
.modal-body{padding:6px 24px 22px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid label{font-weight:500;font-size:13px;color:var(--ink-2)}
.form-grid label input,.form-grid label select{margin-top:6px;font-weight:400;color:var(--ink)}
.span2{grid-column:1/-1}
.preview{margin-top:16px;background:var(--info-bg);color:#243a85;border-radius:var(--r-md);padding:10px 14px;font-size:13px}
.inv-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.inv-brand{display:flex;gap:12px;align-items:center}
.inv-brand b{font-size:16px;font-weight:600}
.inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13.5px;margin-bottom:16px;padding:14px 16px;background:var(--bg);border-radius:12px}
.inv-table{min-width:0!important}
.inv-table tfoot td{font-size:17px;font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Toasts ---------- */
.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:200;width:min(400px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 12px 32px rgba(17,24,39,.18);animation:slide .2s}
.t-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--info-bg);color:var(--info)}
.toast.success .t-ic{background:var(--ok-bg);color:var(--ok)}
.toast.error .t-ic{background:var(--bad-bg);color:var(--bad)}
.toast.warn .t-ic{background:var(--warn-bg);color:var(--warn)}
.t-msg{flex:1;font-size:13.5px;padding-top:4px}
.t-x{border:0;background:transparent;cursor:pointer;color:var(--muted);display:inline-flex;padding:4px;border-radius:6px}
.t-x:hover{background:var(--hover);color:var(--ink)}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar,.app.collapsed .sidebar{position:fixed;inset:0 auto 0 0;width:276px;transform:translateX(-100%);transition:transform .25s}
  .app.nav-open .sidebar{transform:none}
  .app.collapsed .nav-label,.app.collapsed .foot-label{display:inline}
  .app.collapsed .brand-text{display:block}
  .app.collapsed .brand{justify-content:flex-start;padding:20px 20px 16px}
  .app.collapsed .nav-item{justify-content:flex-start;padding:0 12px}
  .app.collapsed .sidebar-foot .btn{justify-content:flex-start}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:35}
  .topbar{padding:10px 14px}.view{padding:18px 16px}
  .clock{display:none}
  .who{display:none}
  .user-chip{padding:4px}
}
@media(max-width:820px){
  .login-shell{grid-template-columns:1fr}
  .login-art{min-height:0;padding:28px}
  .art-copy h1{font-size:26px}
  .art-chips{display:none}
}
@media(max-width:560px){
  .form-grid,.inv-meta{grid-template-columns:1fr}
  .toasts{top:auto;bottom:12px}
  .toolbar input,.toolbar select{width:100%}
  .login-panel{padding:26px 22px}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="login-screen" hidden>
  <div class="login-shell">
    <section class="login-art">
      <div class="art-brand"><span class="mono light">GC</span><span>Gran Continental</span></div>
      <div class="art-copy">
        <h1>Bienvenido a la recepción</h1>
        <p>Reservas, estadías y facturación del hotel en un solo lugar.</p>
      </div>
      <div class="art-chips"><span>Habitaciones</span><span>Huéspedes</span><span>Reservas</span><span>Facturación</span></div>
    </section>
    <section class="login-panel">
      <div class="login-card">
        <h2>Iniciar sesión</h2>
        <p class="lead">Ingrese con su usuario del personal.</p>
        <form id="loginForm" novalidate autocomplete="off">
          <label>Usuario
            <input id="loginUser" name="user" placeholder="admin o recepcion" autocomplete="username">
          </label>
          <label>Clave
            <input id="loginPass" name="pass" type="password" placeholder="••••••••" autocomplete="current-password">
          </label>
          <div id="loginError" class="form-error" role="alert" hidden></div>
          <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
        </form>
        <div class="demo-box">
          <p>Acceso rápido · demostración académica</p>
          <div class="demo-grid">
            <button type="button" class="demo-btn" data-quick="admin">
              <span class="dav a">A</span><span><b>Administrador</b><small>admin / admin123 · acceso total</small></span>
            </button>
            <button type="button" class="demo-btn" data-quick="recepcion">
              <span class="dav r">R</span><span><b>Recepcionista</b><small>recepcion / recep123 · permisos operativos</small></span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span class="mono sm">GC</span><span class="brand-text">Gran Continental<small>Gestión hotelera</small></span></div>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <div class="sidebar-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Mostrar u ocultar menú"></button>
      <div class="ttl"><h2 id="pageTitle">Panel</h2><p class="crumb" id="crumb"></p></div>
      <span class="clock" id="clock"></span>
      <div class="user-chip">
        <span class="avatar" id="avatar">?</span>
        <span class="who"><b id="userName">—</b><span class="role-badge" id="userRole">—</span></span>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn"></button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   1. UTILIDADES (fechas dd/mm/aaaa, moneda COP, iconos, escape HTML)
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return toISO(new Date(y, m - 1, d + n)); };
const diffDays = (a, b) => {
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5);
};
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '—';          // dd/mm/aaaa
const parseDate = str => {                                                       // dd/mm/aaaa -> ISO | null
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(str).trim());
  if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d || y < 2000 || y > 2100) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
};
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const fmtCOP = n => 'COP $' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); // COP $#,###.##
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const code = (p, id) => `${p}-${String(id).padStart(4, '0')}`;
const optionsHTML = (items, sel) => items.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const dateInput = (name, iso) => `<input name="${name}" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" data-mask="date" autocomplete="off" value="${iso ? fmtDate(iso) : ''}">`;

/* =====================================================================

const TOAST_ICON = { success: 'checkc', error: 'alert', warn: 'alert', info: 'info' };
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `<span class="t-ic">${ico(TOAST_ICON[type] || 'info', 17)}</span><span class="t-msg">${esc(msg)}</span><button class="t-x" aria-label="Cerrar">${ico('x', 14)}</button>`;
  const close = () => el.remove();
  el.querySelector('.t-x').onclick = close;
  $('#toasts').appendChild(el);
  setTimeout(close, type === 'error' ? 6500 : 4500);
}
function fail(msg) {
  const el = $('#formError');
  if (el) { el.textContent = msg; el.hidden = false; }
  toast(msg, 'error');
  return false;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function openModal({ title, body, saveLabel = 'Guardar', cancelLabel = 'Cancelar', onSave, onOpen, wide = false, danger = false }) {
  closeModal();
  $('#modalRoot').innerHTML = `
    <div class="modal-backdrop">
      <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <form id="modalForm" novalidate>
          <header><h3 id="mTitle">${esc(title)}</h3><button type="button" class="icon-btn" data-modal-cancel aria-label="Cerrar">${ico('x', 18)}</button></header>
          <div class="modal-body">${body}<div id="formError" class="form-error" role="alert" hidden style="margin-top:12px"></div></div>
          <footer>
            <button type="button" class="btn btn-ghost" data-modal-cancel>${esc(cancelLabel)}</button>
            ${saveLabel ? `<button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${esc(saveLabel)}</button>` : ''}
          </footer>
        </form>
      </div>
    </div>`;
  const f = $('#modalForm');
  f.addEventListener('submit', e => {
    e.preventDefault();
    if (onSave && onSave(f) === false) return;
    closeModal();
  });
  document.querySelectorAll('[data-modal-cancel]').forEach(b => b.addEventListener('click', closeModal));
  if (onOpen) onOpen(f);
  const first = f.querySelector('input:not([readonly]),select:not([disabled])');
  if (first) first.focus();
}
function confirmModal({ title, message, confirmLabel = 'Confirmar', danger = false, onConfirm }) {
  openModal({ title, body: `<p>${message}</p>`, saveLabel: confirmLabel, cancelLabel: 'Volver', danger, onSave: () => { onConfirm(); } });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// RN-05/06: una reserva (Activa o En curso) bloquea el rango [entrada, salida). El día de salida queda libre.
function conflicts(roomId, start, end, ignoreId) {
  return state.reservations.filter(r => r.habitacionId === roomId && r.id !== ignoreId &&
    (r.estado === 'Activa' || r.estado === 'En curso') && start < r.salida && end > r.entrada);
}
// RN-09: Total = (días × tarifa por noche) + servicios adicionales
function calc(s) {
  const dias = s.estado === 'Activa' ? Math.max(1, diffDays(s.checkIn, todayISO())) : Math.max(1, diffDays(s.checkIn, s.checkOut));
  const subtotal = round2(dias * s.tarifa);
  const servicios = s.servicios.map(x => ({ descripcion: x.descripcion, monto: x.monto }));
  const serviciosTotal = round2(servicios.reduce((a, x) => a + x.monto, 0));
  return { dias, tarifa: s.tarifa, subtotal, servicios, serviciosTotal, total: round2(subtotal + serviciosTotal) };
}
function refreshInvoice(inv) {
  if (!inv || inv.estado !== 'Pendiente') return;
  const s = stay(inv.estadiaId);
  if (s && s.estado === 'Activa') Object.assign(inv, calc(s));
}

/* ----- Habitaciones ----- */
function roomForm(id) {
  const r = id ? room(id) : null;
  const hasStay = !!r && state.stays.some(s => s.habitacionId === id && s.estado === 'Activa');
  const canTarifa = can('rooms.tarifa');
  const estadoEnabled = !!r && can('rooms.estado') && !hasStay;
  const body = `
    <div class="form-grid">
      <label>Número de habitación *<input name="numero" maxlength="10" required value="${esc(r ? r.numero : '')}"></label>
      <label>Tipo *<select name="tipo">${optionsHTML(TIPOS.map(t => [t, t]), r ? r.tipo : 'Sencilla')}</select></label>
      <label>Tarifa por noche (COP) *
        <input name="tarifa" type="number" min="1" step="0.01" required value="${r ? r.tarifa : ''}" ${canTarifa ? '' : 'readonly'}>
        ${canTarifa ? '' : `<small class="hint">${ico('lock', 12)} Solo el Administrador puede modificar la tarifa.</small>`}
      </label>
      <label>Estado ${r ? '' : '(inicial)'}
        <select name="estado" ${estadoEnabled ? '' : 'disabled'}>${optionsHTML(ESTADOS.map(e => [e, ROOM_LABEL[e]]), r ? r.estado : 'Disponible')}</select>
        ${r && !estadoEnabled ? `<small class="hint">${hasStay ? 'Tiene una estadía activa.' : ico('lock', 12) + ' Solo el Administrador puede cambiar el estado manualmente.'}</small>` : ''}
      </label>
    </div>`;
  openModal({
    title: r ? `Editar habitación ${r.numero}` : 'Nueva habitación', body,
    onSave: f => {
      const numero = f.numero.value.trim(), tipo = f.tipo.value, tarifa = Number(f.tarifa.value);
      if (!numero) return fail('El número de habitación es obligatorio');
      if (!(tarifa > 0)) return fail('La tarifa por noche debe ser un valor mayor a cero');
      if (state.rooms.some(x => x.id !== id && norm(x.numero) === norm(numero))) return fail(`Ya existe una habitación con el número ${numero}`);
      if (r) {
        if (tarifa !== r.tarifa && !guard('rooms.tarifa')) return false;
        const estado = f.estado.value;
        if (estado !== r.estado && !guard('rooms.estado')) return false;
        Object.assign(r, { numero, tipo, tarifa, estado });
        toast(`Habitación ${numero} actualizada`, 'success');
      } else {
        state.rooms.push({ id: nextId('room'), numero, tipo, tarifa, estado: 'Disponible' });
        toast(`Habitación ${numero} creada con estado Disponible`, 'success');
      }
      commit();
    }
  });
}
function roomDelete(id) {
  const r = room(id); if (!r) return;
  if (r.estado === 'Ocupada') return toast(`No se puede eliminar la habitación ${r.numero}: está Ocupada`, 'error');
  const vivas = state.reservations.filter(x => x.habitacionId === id && (x.estado === 'Activa' || x.estado === 'En curso'));
  if (vivas.length) return toast(`No se puede eliminar la habitación ${r.numero}: tiene ${vivas.length} reserva(s) activa(s) o futura(s) asociada(s)`, 'error');
  confirmModal({ title: 'Eliminar habitación', message: `¿Eliminar definitivamente la habitación <b>${esc(r.numero)}</b>?`, confirmLabel: 'Eliminar', danger: true,
    onConfirm: () => { state.rooms = state.rooms.filter(x => x.id !== id); commit(); toast(`Habitación ${r.numero} eliminada`, 'success'); } });
}
function roomClean(id) {
  const r = room(id); if (!r) return;
  if (r.estado !== 'Mantenimiento') return toast('Solo se pueden habilitar habitaciones en Mantenimiento/Limpieza', 'warn');
  r.estado = 'Disponible'; commit(); toast(`Habitación ${r.numero} lista: ahora está Disponible`, 'success');
}

    <div class="form-grid">

      <label class="span2">Habitación *<select name="habitacion"><option value="">Seleccione…</option>${optionsHTML(state.rooms.map(h => [h.id, `Hab. ${h.numero} · ${h.tipo} · ${fmtCOP(h.tarifa)}/noche`]), hSel)}</select></label>
      <label>Fecha de entrada *${dateInput('entrada', r ? r.entrada : opts.entrada)}</label>
      <label>Fecha de salida *${dateInput('salida', r ? r.salida : opts.salida)}</label>
    </div>
    <div class="preview" id="resPreview"></div>`;
  openModal({
    title: r ? `Editar reserva ${code('R', r.id)}` : 'Nueva reserva', body,
    onOpen: f => {
      const upd = () => setTimeout(() => {
        const e = parseDate(f.entrada.value), s = parseDate(f.salida.value), rm = room(Number(f.habitacion.value)), box = $('#resPreview');
        if (!box) return;
        if (e && s && s > e && rm) { const n = diffDays(e, s); box.textContent = `${n} noche(s) · Alojamiento estimado: ${fmtCOP(n * rm.tarifa)}`; }
        else box.textContent = 'Ingrese fechas válidas (dd/mm/aaaa) para ver el estimado.';
      }, 0);
      f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
    },
    onSave: f => {
      const gid = Number(f.huesped.value), rid = Number(f.habitacion.value);
      if (!gid) return fail('Seleccione un huésped');
      if (!rid) return fail('Seleccione una habitación');
      const e = parseDate(f.entrada.value), s = parseDate(f.salida.value);
      if (!e || !s) return fail('Fecha inválida. Use el formato dd/mm/aaaa con fechas reales');
      if (s <= e) return fail('La fecha de salida debe ser estrictamente posterior a la fecha de entrada');
      if (e < todayISO()) return fail('La fecha de entrada no puede ser anterior a hoy');
      if (conflicts(rid, e, s, r && r.id).length) return fail('La habitación no está disponible en el rango de fechas seleccionado');
      if (r) {
        Object.assign(r, { huespedId: gid, habitacionId: rid, entrada: e, salida: s });
        toast(`Reserva ${code('R', r.id)} actualizada`, 'success');
      } else {
        const id = nextId('res');
        state.reservations.push({ id, habitacionId: rid, huespedId: gid, entrada: e, salida: s, estado: 'Activa' });
        toast(`Reserva ${code('R', id)} creada: Hab. ${roomNum(rid)} del ${fmtDate(e)} al ${fmtDate(s)}`, 'success');
      }
      commit();
    }
  });
}
function reservationCancel(id) {
  const r = res(id); if (!r) return;
  if (r.estado !== 'Activa') return toast('Solo se pueden cancelar reservas activas (sin check-in)', 'error');
  confirmModal({ title: 'Cancelar reserva', message: `¿Cancelar la reserva <b>${code('R', id)}</b> de ${esc(guestName(r.huespedId))}? Las fechas se liberarán de inmediato.`, confirmLabel: 'Cancelar reserva', danger: true,
    onConfirm: () => { r.estado = 'Cancelada'; commit(); toast(`Reserva ${code('R', id)} cancelada. Fechas liberadas.`, 'success'); } });
}
function reservationDelete(id) {
  const r = res(id); if (!r) return;
  if (r.estado === 'En curso' || r.estado === 'Finalizada') return toast('No se puede eliminar una reserva con estadía registrada', 'error');
  confirmModal({ title: 'Eliminar reserva', message: `¿Eliminar definitivamente la reserva <b>${code('R', id)}</b>?`, confirmLabel: 'Eliminar', danger: true,
    onConfirm: () => { state.reservations = state.reservations.filter(x => x.id !== id); commit(); toast('Reserva eliminada', 'success'); } });
}

/* ----- Estadías ----- */
function checkIn(resId) {
  const r = res(resId), t = todayISO();
  if (!r || r.estado !== 'Activa') return toast('El check-in solo es posible con una reserva válida (activa)', 'error');
  if (t < r.entrada) return toast(`Reserva aún no vigente: la entrada es el ${fmtDate(r.entrada)}`, 'error');
  if (t >= r.salida) return toast(`La reserva venció el ${fmtDate(r.salida)}. Cree una nueva reserva`, 'error');
  const h = room(r.habitacionId);
  if (!h) return toast('La habitación de la reserva ya no existe', 'error');
  if (h.estado !== 'Disponible') return toast(`La habitación ${h.numero} no está disponible para check-in (estado: ${ROOM_LABEL[h.estado]})`, 'error');
  state.stays.push({ id: nextId('stay'), reservaId: r.id, habitacionId: h.id, huespedId: r.huespedId, checkIn: t, checkOut: null, tarifa: h.tarifa, servicios: [], estado: 'Activa' });
  r.estado = 'En curso'; h.estado = 'Ocupada';
  commit(); toast(`Check-in realizado: ${guestName(r.huespedId)} en la habitación ${h.numero}`, 'success');
}
function serviceForm(stayId) {
  const s = stay(stayId); if (!s || s.estado !== 'Activa') return;
  const inv = invoiceOfStay(stayId);
  if (inv && inv.estado === 'Pagada') return toast('La cuenta ya fue saldada. Realice el check-out', 'warn');
  openModal({
    title: `Agregar servicio · Hab. ${roomNum(s.habitacionId)}`,
    body: `<div class="form-grid"><label class="span2">Descripción *<input name="descripcion" maxlength="60" placeholder="Ej. Desayuno, Lavandería, Minibar"></label>
           <label class="span2">Valor (COP) *<input name="monto" type="number" min="0.01" step="0.01"></label></div>`,
    onSave: f => {
      const descripcion = f.descripcion.value.trim(), monto = round2(f.monto.value);
      if (!descripcion) return fail('La descripción del servicio es obligatoria');
      if (!(monto > 0)) return fail('El valor del servicio debe ser mayor a cero');
      s.servicios.push({ descripcion, monto });
      refreshInvoice(invoiceOfStay(stayId));
      commit(); toast(`Servicio agregado: ${descripcion} (${fmtCOP(monto)})`, 'success');
    }
  });
}
function invoiceHTML(d) {
  const filas = d.servicios.map(x => `<tr><td>${esc(x.descripcion)}</td><td class="num">1</td><td class="num">${fmtCOP(x.monto)}</td><td class="num">${fmtCOP(x.monto)}</td></tr>`).join('');
  return `<div class="invoice">
    <div class="inv-head">
      <div class="inv-brand"><span class="mono sm">GC</span><div><b>Gran Continental</b><br><span class="small">${d.numero ? 'Factura ' + esc(d.numero) : 'Pre-factura (sin emitir)'} · ${fmtDate(d.fecha)}</span></div></div>
      ${badge(d.estado, INV_CLASS[d.estado] || 'muted')}
    </div>
    <div class="inv-meta">
      <div><span class="muted">Huésped:</span> ${esc(d.huespedNombre)}</div><div><span class="muted">Documento:</span> ${esc(d.documento)}</div>
      <div><span class="muted">Habitación:</span> ${esc(d.habitacionNumero)} (${esc(d.habitacionTipo)})</div><div><span class="muted">Check-in:</span> ${fmtDate(d.checkIn)}</div>
    </div>
    <table class="table inv-table">
      <thead><tr><th>Concepto</th><th class="num">Cant.</th><th class="num">Valor unit.</th><th class="num">Subtotal</th></tr></thead>
      <tbody>
        <tr><td>Alojamiento</td><td class="num">${d.dias} noche(s)</td><td class="num">${fmtCOP(d.tarifa)}</td><td class="num">${fmtCOP(d.subtotal)}</td></tr>
        ${filas || '<tr><td colspan="4" class="muted">Sin servicios adicionales</td></tr>'}
      </tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="num">${fmtCOP(d.total)}</td></tr></tfoot>
    </table>
    <p class="small" style="margin-top:10px">Total = (${d.dias} día(s) × ${fmtCOP(d.tarifa)}) + servicios adicionales ${fmtCOP(d.serviciosTotal)}</p>
    ${d.estado === 'Pagada' ? `<p class="small">Pagada el ${fmtDate(d.fechaPago)} · Método: ${esc(d.pagoMetodo)}</p>` : ''}
  </div>`;
}
function invoiceModal(stayId) {
  const s = stay(stayId); if (!s) return;
  const inv = invoiceOfStay(stayId);
  if (inv) { refreshInvoice(inv); saveState(); }
  const g = guest(s.huespedId), r = room(s.habitacionId);
  const data = inv || Object.assign({ estado: 'Sin emitir', numero: null, fecha: todayISO(), huespedNombre: guestName(s.huespedId),
    documento: g ? g.documento : '—', habitacionNumero: r ? r.numero : '—', habitacionTipo: r ? r.tipo : '—', checkIn: s.checkIn }, calc(s));
  const pagoSel = inv && inv.estado === 'Pendiente'
    ? `<label style="display:block;margin-top:16px;font-weight:500;font-size:13px;color:var(--ink-2)">Método de pago<select name="metodo" style="margin-top:6px">${optionsHTML(['Efectivo', 'Tarjeta', 'Transferencia'].map(x => [x, x]), 'Efectivo')}</select></label>` : '';
  openModal({
    title: inv ? `Factura ${inv.numero}` : 'Emitir factura', wide: true, body: invoiceHTML(data) + pagoSel,
    saveLabel: !inv ? 'Emitir factura' : inv.estado === 'Pendiente' ? 'Registrar pago' : null,
    cancelLabel: inv && inv.estado === 'Pagada' ? 'Cerrar' : 'Cancelar',
    onSave: f => {
      if (!guard('invoices.issue')) return false;
      if (!inv) {
        const id = nextId('inv'), d = calc(s);
        state.invoices.push({ id, numero: code('F', id), estadiaId: s.id, huespedId: s.huespedId, huespedNombre: guestName(s.huespedId),
          documento: g ? g.documento : '—', habitacionNumero: r ? r.numero : '—', habitacionTipo: r ? r.tipo : '—', checkIn: s.checkIn,
          fecha: todayISO(), estado: 'Pendiente', ...d });
        commit(); toast(`Factura ${code('F', id)} emitida por ${fmtCOP(d.total)}. Registre el pago para habilitar el check-out`, 'success');
      } else {
        refreshInvoice(inv);
        inv.estado = 'Pagada'; inv.pagoMetodo = f.metodo.value; inv.fechaPago = todayISO();
        commit(); toast(`Pago de ${fmtCOP(inv.total)} registrado. La cuenta quedó en cero`, 'success');
      }
    }
  });
}
function invoiceDelete(id) {
  const inv = state.invoices.find(i => i.id === id); if (!inv) return;
  if (inv.estado === 'Pagada') return toast('No se puede anular una factura ya pagada', 'error');
  confirmModal({ title: 'Anular factura', message: `¿Anular la factura <b>${esc(inv.numero)}</b>?`, confirmLabel: 'Anular', danger: true,
    onConfirm: () => { state.invoices = state.invoices.filter(i => i.id !== id); commit(); toast(`Factura ${inv.numero} anulada`, 'success'); } });
}
function checkOut(stayId) {
  const s = stay(stayId);
  if (!s || s.estado !== 'Activa') return toast('La estadía no está activa', 'error');
  const inv = invoiceOfStay(stayId);
  if (!inv) return toast('No se puede hacer check-out: la cuenta no ha sido facturada ni saldada', 'error');
  refreshInvoice(inv);
  if (inv.estado !== 'Pagada') { saveState(); return toast(`No se puede hacer check-out: saldo pendiente de ${fmtCOP(inv.total)}`, 'error'); }
  confirmModal({ title: 'Confirmar check-out', message: `¿Finalizar la estadía de <b>${esc(guestName(s.huespedId))}</b> en la habitación <b>${esc(roomNum(s.habitacionId))}</b>? La habitación pasará a Mantenimiento/Limpieza.`, confirmLabel: 'Hacer check-out',
    onConfirm: () => {
      s.estado = 'Finalizada'; s.checkOut = todayISO();
      const rv = res(s.reservaId); if (rv) rv.estado = 'Finalizada';
      const h = room(s.habitacionId); if (h) h.estado = 'Mantenimiento';
      commit(); toast(`Check-out completado. Habitación ${roomNum(s.habitacionId)} en Mantenimiento/Limpieza`, 'success');
    } });
}
function resetDemo() {
  confirmModal({ title: 'Restablecer datos demo', message: 'Se perderán todos los cambios y se cargarán los datos iniciales. ¿Continuar?', confirmLabel: 'Restablecer', danger: true,
    onConfirm: () => { state = seed(); ui.avail = null; commit(); toast('Datos de demostración restablecidos', 'success'); } });
}

/* =====================================================================
   6. ACCIONES (despachador central con verificación RBAC)
   ===================================================================== */
const ACTIONS = {
  'room.new':      { perm: 'rooms.create',        fn: () => roomForm() },
  'room.edit':     { perm: 'rooms.edit',          fn: id => roomForm(id) },
  'room.delete':   { perm: 'rooms.delete',        fn: id => roomDelete(id) },
  'room.clean':    { perm: 'rooms.clean',         fn: id => roomClean(id) },
  'guest.new':     { perm: 'guests.create',       fn: () => guestForm() },
  'guest.edit':    { perm: 'guests.edit',         fn: id => guestForm(id) },
  'guest.delete':  { perm: 'guests.delete',       fn: id => guestDelete(id) },
  'res.new':       { perm: 'reservations.create', fn: () => reservationForm() },
  'res.edit':      { perm: 'reservations.edit',   fn: id => reservationForm({ id }) },
  'res.cancel':    { perm: 'reservations.cancel', fn: id => reservationCancel(id) },
  'res.delete':    { perm: 'reservations.delete', fn: id => reservationDelete(id) },
  'avail.reserve': { perm: 'reservations.create', fn: id => { const g = ui.avail && ui.avail.range; reservationForm({ habitacionId: id, entrada: g ? g.e : null, salida: g ? g.s : null }); } },
  'stay.checkin':  { perm: 'stays.checkin',       fn: id => checkIn(id) },
  'stay.checkout': { perm: 'stays.checkout',      fn: id => checkOut(id) },
  'stay.service':  { perm: 'stays.services',      fn: id => serviceForm(id) },
  'stay.invoice':  { perm: 'invoices.view',       fn: id => invoiceModal(id) },
  'inv.open':      { perm: 'invoices.view',       fn: id => { const i = state.invoices.find(x => x.id === id); if (i) invoiceModal(i.estadiaId); } },
  'inv.delete':    { perm: 'invoices.delete',     fn: id => invoiceDelete(id) },
  'demo.reset':    { perm: 'system.reset',        fn: () => resetDemo() }
};
function runAction(act, id, el) {
  const a = ACTIONS[act]; if (!a) return;
  if (!can(a.perm)) return deny();                 // RBAC: también bloquea intentos forzados
  a.fn(id, el);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  runAction(b.dataset.act, b.dataset.id ? Number(b.dataset.id) : undefined, b);
});
// Botón con candado visual si el rol no tiene el permiso (sigue siendo clicable para mostrar el toast de alerta)
function btn(act, label, id, cls = 'btn-ghost', icon) {
  const locked = !can(ACTIONS[act].perm);
  const ic = locked ? ico('lock', 14) : (icon ? ico(icon, 14) : '');
  return `<button type="button" class="btn btn-sm ${cls} ${locked ? 'is-locked' : ''}" data-act="${act}"${id != null ? ` data-id="${id}"` : ''}${locked ? ' aria-disabled="true" title="Requiere permisos de Administrador"' : ''}>${ic}${label}</button>`;
}
window.GC = { dispatch: (act, id) => runAction(act, id), can };   // útil para demostrar intentos forzados desde la consola

/* =====================================================================
   7. VISTAS
   ===================================================================== */
const stat = (icon, tone, label, value, sub, money) =>
  `<article class="stat"><span class="stat-ic ${tone}">${ico(icon, 21)}</span><div><p class="lbl">${label}</p><p class="val${money ? ' money' : ''}">${value}</p>${sub ? `<p class="sub">${sub}</p>` : ''}</div></article>`;

function viewDashboard() {
  const total = state.rooms.length, c = e => state.rooms.filter(r => r.estado === e).length;
  const occ = total ? Math.round(c('Ocupada') / total * 100) : 0;
  const cobrado = round2(state.invoices.filter(i => i.estado === 'Pagada').reduce((a, i) => a + i.total, 0));
  const porCobrar = round2(state.invoices.filter(i => i.estado === 'Pendiente').reduce((a, i) => a + i.total, 0));
  const stats = [
    stat('bed', '', 'Habitaciones', total, 'registradas'),
    stat('checkc', 'ok', 'Disponibles', c('Disponible'), 'listas para huéspedes'),
    stat('door', 'bad', 'Ocupadas', c('Ocupada'), `${occ}% de ocupación`),
    stat('sparkle', 'warn', 'Mantenimiento/Limpieza', c('Mantenimiento'), 'fuera de servicio'),
    stat('calendar', 'info', 'Reservas activas', state.reservations.filter(r => r.estado === 'Activa').length, 'pendientes de check-in'),
    stat('users', '', 'Huéspedes', state.guests.length, 'registrados'),
    stat('wallet', 'ok', 'Ingresos cobrados', fmtCOP(cobrado), 'facturas pagadas', true),
    stat('clock', 'warn', 'Por cobrar', fmtCOP(porCobrar), 'facturas pendientes', true)
  ].join('');
  const tiles = state.rooms.slice().sort((a, b) => a.numero.localeCompare(b.numero, 'es', { numeric: true })).map(r => {
    const s = state.stays.find(x => x.habitacionId === r.id && x.estado === 'Activa');
    const next = state.reservations.filter(x => x.habitacionId === r.id && x.estado === 'Activa').sort((a, b) => a.entrada.localeCompare(b.entrada))[0];
    let det = '<p class="muted">Sin reservas próximas</p>';
    if (s) { const rv = res(s.reservaId); det = `<p>${esc(guestName(s.huespedId))}</p><p class="muted">Salida prevista: ${fmtDate(rv ? rv.salida : null)}</p>`; }
    else if (next) det = `<p>${esc(guestName(next.huespedId))}</p><p class="muted">${fmtDate(next.entrada)} → ${fmtDate(next.salida)}</p>`;
    return `<article class="tile ${ROOM_CLASS[r.estado]}">
      <div class="tile-top"><div><h4>${esc(r.numero)}</h4><p class="muted">${esc(r.tipo)}</p></div>${badge(ROOM_LABEL[r.estado], ROOM_CLASS[r.estado])}</div>
      <p><b>${fmtCOP(r.tarifa)}</b> <span class="muted">/ noche</span></p>${det}
      ${r.estado === 'Mantenimiento' ? btn('room.clean', 'Marcar disponible', r.id, 'btn-success', 'refresh') : ''}
    </article>`;
  }).join('') || '<p class="muted">No hay habitaciones registradas.</p>';
  const caps = CAPABILITIES.map(([l, p]) => can(p)
    ? `<span class="perm yes">${ico('check', 13)}<span>${l}</span></span>`
    : `<span class="perm no">${ico('lock', 13)}<span>${l}</span></span>`).join('');
  return `<div class="hello"><h3>Hola, ${esc(session.nombre.split(' ')[0])}</h3><p>Resumen del hotel al ${fmtDate(todayISO())}</p></div>
    <div class="stats">${stats}</div>
    <div class="section-title">Habitaciones en tiempo real
      <span class="legend"><span><i class="dot ok"></i>Disponible</span><span><i class="dot bad"></i>Ocupada</span><span><i class="dot warn"></i>Mantenimiento</span></span></div>
    <div class="rack">${tiles}</div>
    <div class="panel"><div class="section-title">Permisos de su rol · ${ROLE_LABEL[session.role]}</div><div class="perm-list">${caps}</div></div>`;
}

function viewRooms() {
  const rows = state.rooms.slice().sort((a, b) => a.numero.localeCompare(b.numero, 'es', { numeric: true })).map(r => `<tr>
    <td><strong>${esc(r.numero)}</strong></td><td>${esc(r.tipo)}</td><td class="num">${fmtCOP(r.tarifa)}</td>
    <td>${badge(ROOM_LABEL[r.estado], ROOM_CLASS[r.estado])}</td>

function guestRows() {

function viewGuests() {

function viewReservations() {

      <td>${fmtDate(r.entrada)}</td><td>${fmtDate(r.salida)}</td><td class="num">${diffDays(r.entrada, r.salida)}</td><td>${badge(r.estado, RES_CLASS[r.estado])}</td>

    <select id="resFilter" aria-label="Filtrar por estado">${optionsHTML(['Todas', 'Activa', 'En curso', 'Finalizada', 'Cancelada'].map(x => [x, x === 'Todas' ? 'Todos los estados' : x]), f)}</select>
    ${btn('res.new', 'Nueva reserva', null, 'btn-primary', 'plus')}</div></div>
    <div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Huésped</th><th>Habitación</th><th>Entrada</th><th>Salida</th><th class="num">Noches</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" class="empty">No hay reservas para este filtro</td></tr>'}</tbody></table></div>`;
}

function viewAvailability() {
  const t = todayISO();
  const a = ui.avail || { entrada: fmtDate(t), salida: fmtDate(addDays(t, 1)), range: { e: t, s: addDays(t, 1) } };
  let results = '<p class="muted" style="padding:22px">Ingrese un rango de fechas válido y presione Consultar.</p>';
  if (a.range) {
    const n = diffDays(a.range.e, a.range.s);
    const rows = state.rooms.slice().sort((x, y) => x.numero.localeCompare(y.numero, 'es', { numeric: true })).map(r => {
      const cf = conflicts(r.id, a.range.e, a.range.s), free = cf.length === 0;
      return `<tr><td><strong>${esc(r.numero)}</strong></td><td>${esc(r.tipo)}</td><td class="num">${fmtCOP(r.tarifa)}</td>
        <td>${free ? badge('Disponible', 'ok') : badge('No disponible', 'bad')}${free ? '' : `<div class="small">Cruce: ${cf.map(c => `${code('R', c.id)} (${fmtDate(c.entrada)} – ${fmtDate(c.salida)})`).join(', ')}</div>`}</td>
        <td>${badge(ROOM_LABEL[r.estado], ROOM_CLASS[r.estado])}</td><td class="num">${free ? fmtCOP(n * r.tarifa) : '—'}</td>
        <td>${free ? btn('avail.reserve', 'Reservar', r.id, 'btn-primary', 'calendar') : ''}</td></tr>`;
    }).join('');
    results = `<table class="table"><thead><tr><th>Habitación</th><th>Tipo</th><th class="num">Tarifa</th><th>Disponibilidad en el rango</th><th>Estado actual</th><th class="num">Alojamiento (${n} noche/s)</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="empty">No hay habitaciones registradas</td></tr>'}</tbody></table>`;
  }
  return `<div class="view-head"><h3>Consulta de disponibilidad</h3></div>
    <form id="availForm" class="panel" style="margin-bottom:22px" novalidate>
      <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end">
        <label>Fecha de entrada<input name="entrada" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" data-mask="date" value="${esc(a.entrada)}" autocomplete="off"></label>
        <label>Fecha de salida<input name="salida" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" data-mask="date" value="${esc(a.salida)}" autocomplete="off"></label>
        <button class="btn btn-primary" type="submit">${ico('search', 15)} Consultar</button>
      </div></form>
    <div class="table-wrap">${results}</div>`;
}

function viewStays() {
  const t = todayISO();
  const ready = state.reservations.filter(r => r.estado === 'Activa' && r.entrada <= t && r.salida > t);
  const active = state.stays.filter(s => s.estado === 'Activa');
  const done = state.stays.filter(s => s.estado === 'Finalizada').slice().reverse();
  const readyRows = ready.map(r => `<tr><td><strong>${code('R', r.id)}</strong></td><td>${esc(guestName(r.huespedId))}</td><td>Hab. ${esc(roomNum(r.habitacionId))} ${room(r.habitacionId) ? badge(ROOM_LABEL[room(r.habitacionId).estado], ROOM_CLASS[room(r.habitacionId).estado]) : ''}</td>
    <td>${fmtDate(r.entrada)} → ${fmtDate(r.salida)}</td><td>${btn('stay.checkin', 'Check-in', r.id, 'btn-success', 'key')}</td></tr>`).join('');
  const activeRows = active.map(s => {
    const inv = invoiceOfStay(s.id), c = calc(s);
    const invBtn = !inv ? btn('stay.invoice', 'Emitir factura', s.id, 'btn-ghost', 'file') : inv.estado === 'Pendiente' ? btn('stay.invoice', 'Cobrar factura', s.id, 'btn-success', 'card') : btn('stay.invoice', 'Ver factura', s.id, 'btn-ghost', 'file');
    const serv = s.servicios.length ? s.servicios.map(x => `<div class="small">${esc(x.descripcion)} · ${fmtCOP(x.monto)}</div>`).join('') : '<span class="small">Sin servicios</span>';
    return `<tr><td><strong>${esc(guestName(s.huespedId))}</strong></td><td>Hab. ${esc(roomNum(s.habitacionId))}</td><td>${fmtDate(s.checkIn)}</td><td class="num">${c.dias}</td>
      <td>${serv}</td><td class="num"><b>${fmtCOP(c.total)}</b></td><td>${inv ? badge(inv.estado, INV_CLASS[inv.estado]) : badge('Sin emitir', 'muted')}</td>
      <td><div class="row-actions">${btn('stay.service', 'Servicio', s.id, 'btn-ghost', 'plus')}${invBtn}${btn('stay.checkout', 'Check-out', s.id, 'btn-primary', 'logout')}</div></td></tr>`;
  }).join('');
  const doneRows = done.map(s => { const inv = invoiceOfStay(s.id); return `<tr><td>${esc(guestName(s.huespedId))}</td><td>Hab. ${esc(roomNum(s.habitacionId))}</td><td>${fmtDate(s.checkIn)}</td><td>${fmtDate(s.checkOut)}</td>
    <td class="num">${inv ? fmtCOP(inv.total) : '—'}</td><td>${inv ? btn('stay.invoice', 'Ver factura', s.id, 'btn-ghost', 'file') : ''}</td></tr>`; }).join('');
  return `<div class="view-head"><h3>Estadías · Check-in / Check-out</h3></div>
    <div class="section-title">Reservas listas para check-in (hoy ${fmtDate(t)})</div>
    <div class="table-wrap"><table class="table"><thead><tr><th>Reserva</th><th>Huésped</th><th>Habitación</th><th>Vigencia</th><th></th></tr></thead>
    <tbody>${readyRows || '<tr><td colspan="5" class="empty">No hay reservas vigentes pendientes de check-in</td></tr>'}</tbody></table></div>
    <div class="section-title">Estadías activas</div>
    <div class="table-wrap"><table class="table" style="min-width:900px"><thead><tr><th>Huésped</th><th>Habitación</th><th>Check-in</th><th class="num">Noches</th><th>Servicios</th><th class="num">Cuenta actual</th><th>Factura</th><th>Acciones</th></tr></thead>
    <tbody>${activeRows || '<tr><td colspan="8" class="empty">No hay estadías activas</td></tr>'}</tbody></table></div>
    <div class="section-title">Historial de estadías finalizadas</div>
    <div class="table-wrap"><table class="table"><thead><tr><th>Huésped</th><th>Habitación</th><th>Check-in</th><th>Check-out</th><th class="num">Total facturado</th><th></th></tr></thead>
    <tbody>${doneRows || '<tr><td colspan="6" class="empty">Aún no hay estadías finalizadas</td></tr>'}</tbody></table></div>`;
}

function viewInvoices() {
  const sum = est => round2(state.invoices.filter(i => !est || i.estado === est).reduce((a, i) => a + i.total, 0));
  const rows = state.invoices.slice().sort((a, b) => b.id - a.id).map(i => `<tr><td><strong>${esc(i.numero)}</strong></td><td>${fmtDate(i.fecha)}</td><td>${esc(i.huespedNombre)}</td>
    <td>Hab. ${esc(i.habitacionNumero)}</td><td class="num">${i.dias}</td><td class="num">${fmtCOP(i.serviciosTotal)}</td><td class="num"><b>${fmtCOP(i.total)}</b></td><td>${badge(i.estado, INV_CLASS[i.estado])}</td>
    <td><div class="row-actions">${btn('inv.open', i.estado === 'Pendiente' ? 'Ver / Cobrar' : 'Ver', i.id, i.estado === 'Pendiente' ? 'btn-success' : 'btn-ghost', i.estado === 'Pendiente' ? 'card' : 'file')}${i.estado === 'Pendiente' ? btn('inv.delete', 'Anular', i.id, 'btn-danger-ghost', 'x') : ''}</div></td></tr>`).join('');
  return `<div class="view-head"><h3>Facturación</h3></div>
    <div class="stats">
      ${stat('file', 'info', 'Total facturado', fmtCOP(sum()), '', true)}
      ${stat('checkc', 'ok', 'Cobrado', fmtCOP(sum('Pagada')), '', true)}
      ${stat('clock', 'warn', 'Por cobrar', fmtCOP(sum('Pendiente')), '', true)}
    </div>
    <div class="table-wrap"><table class="table" style="min-width:860px"><thead><tr><th>Factura</th><th>Fecha</th><th>Huésped</th><th>Habitación</th><th class="num">Días</th><th class="num">Servicios</th><th class="num">Total</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="9" class="empty">Aún no se han emitido facturas. Emítalas desde Estadías.</td></tr>'}</tbody></table></div>`;
}

const VIEWS = {
  dashboard:      { title: 'Panel general',  icon: 'grid',     render: viewDashboard },
  habitaciones:   { title: 'Habitaciones',   icon: 'bed',      render: viewRooms },
  huespedes:      { title: 'Huéspedes',      icon: 'users',    render: viewGuests },
  reservas:       { title: 'Reservas',       icon: 'calendar', render: viewReservations },
  disponibilidad: { title: 'Disponibilidad', icon: 'search',   render: viewAvailability },
  estadias:       { title: 'Estadías',       icon: 'key',      render: viewStays },
  facturacion:    { title: 'Facturación',    icon: 'file',     render: viewInvoices }
};

/* =====================================================================
   8. RENDER, NAVEGACIÓN Y SESIÓN
   ===================================================================== */
function renderNav() {
  $('#nav').innerHTML = Object.entries(VIEWS).map(([k, v]) =>
    `<button class="nav-item ${ui.view === k ? 'active' : ''}" data-view="${k}" title="${v.title}"><span class="nav-ico">${ico(v.icon, 19)}</span><span class="nav-label">${v.title}</span></button>`).join('');
  $('#sideFoot').innerHTML = btn('demo.reset', '<span class="foot-label">Restablecer demo</span>', null, 'btn-ghost', 'refresh');
}
function renderUser() {
  $('#userName').textContent = session.nombre;
  const rb = $('#userRole'); rb.textContent = ROLE_LABEL[session.role]; rb.className = `role-badge role-${session.role}`;
  $('#avatar').textContent = session.nombre.charAt(0).toUpperCase();
}
function render() {
  if (!session) return;
  const v = VIEWS[ui.view];
  $('#pageTitle').textContent = v.title;
  $('#crumb').textContent = 'Gran Continental';
  $('#view').innerHTML = v.render();
  if (ui.view === 'huespedes') updateGuestCount();
  renderNav(); renderUser();
}
function updateGuestCount() {
  const el = $('#guestCount'); if (!el) return;
  const q = norm(ui.guestQuery);
  const n = state.guests.filter(g => !q || norm(`${g.nombre} ${g.apellido} ${g.documento}`).includes(q)).length;
  el.textContent = `· ${n} de ${state.guests.length}`;
}
function go(v) { ui.view = v; render(); document.getElementById('app').classList.remove('nav-open'); window.scrollTo(0, 0); }
function updateClock() { const d = new Date(); $('#clock').textContent = `${fmtDate(toISO(d))} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

function showLogin() { $('#app').hidden = true; $('#loginScreen').hidden = false; $('#loginPass').value = ''; $('#loginUser').focus(); }
function showApp() { $('#loginScreen').hidden = true; $('#app').hidden = false; render(); updateClock(); }
function doLogin(u, p) {
  const found = USERS.find(x => x.user === String(u).trim().toLowerCase() && x.pass === p);
  const err = $('#loginError');
  if (!found) { err.textContent = 'Usuario o clave incorrectos'; err.hidden = false; toast('Credenciales inválidas', 'error'); return; }
  err.hidden = true;
  session = { user: found.user, nombre: found.nombre, role: found.role };
  saveSession(); ui.view = 'dashboard'; showApp();
  toast(`Bienvenido/a, ${found.nombre} (${ROLE_LABEL[found.role]})`, 'success');
}
function logout() {
  closeModal(); session = null; saveSession(); $('#loginUser').value = ''; showLogin(); toast('Sesión cerrada correctamente', 'info');
}

/* ---------- Eventos globales ---------- */
$('#menuBtn').innerHTML = ico('menu', 20);
$('#logoutBtn').innerHTML = ico('logout', 15) + ' Cerrar sesión';
$('#loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin($('#loginUser').value, $('#loginPass').value); });
document.querySelectorAll('[data-quick]').forEach(b => b.addEventListener('click', () => {
  const u = USERS.find(x => x.user === b.dataset.quick);
  $('#loginUser').value = u.user; $('#loginPass').value = u.pass; doLogin(u.user, u.pass);
}));
$('#logoutBtn').addEventListener('click', logout);
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
$('#menuBtn').addEventListener('click', () => {
  const app = $('#app');
  if (window.matchMedia('(max-width:900px)').matches) app.classList.toggle('nav-open'); else app.classList.toggle('collapsed');
});
$('#scrim').addEventListener('click', () => $('#app').classList.remove('nav-open'));

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.mask === 'date') {                  // máscara dd/mm/aaaa
    let v = t.value.replace(/\D/g, '').slice(0, 8);
    if (v.length > 4) v = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
    else if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
    t.value = v;
  }
  if (t.id === 'guestSearch') {                                  // búsqueda reactiva
    ui.guestQuery = t.value; $('#guestRows').innerHTML = guestRows(); updateGuestCount();
  }
});
document.addEventListener('change', e => { if (e.target.id === 'resFilter') { ui.resFilter = e.target.value; render(); } });
document.addEventListener('submit', e => {
  if (e.target.id !== 'availForm') return;
  e.preventDefault();
  const f = e.target, eRaw = f.entrada.value, sRaw = f.salida.value, en = parseDate(eRaw), sa = parseDate(sRaw);
  if (!en || !sa) { ui.avail = { entrada: eRaw, salida: sRaw, range: null }; render(); return toast('Fecha inválida. Use el formato dd/mm/aaaa con fechas reales', 'error'); }
  if (sa <= en) { ui.avail = { entrada: eRaw, salida: sRaw, range: null }; render(); return toast('La fecha de salida debe ser estrictamente posterior a la fecha de entrada', 'error'); }
  ui.avail = { entrada: eRaw, salida: sRaw, range: { e: en, s: sa } }; render();
});

// Tiempo real: reloj, refresco del rack y sincronización entre pestañas
setInterval(() => { if (!session) return; updateClock(); if (ui.view === 'dashboard' && !$('.modal')) render(); }, 30000);
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY && session) { state = loadState(); if (!$('.modal')) render(); } });

/* ---------- Arranque ---------- */
saveState();
session ? showApp() : showLogin();
})();
</script>
</body>
</html>
